<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="referrer" content="no-referrer" />
<title>CarPlay</title>
<style>
  :root {
    --bg: #000;
    --panel: #16181b;
    --line: #2a2d31;
    --text: #e8e8e6;
    --muted: #8b8f94;
    --accent: #3e8bff;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg); overflow: hidden;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
  }
  #frame {
    position: fixed; top: 0; left: 0; border: 0; display: block;
    transform-origin: 0 0;
  }
  #gear {
    position: fixed; top: 8px; right: 8px; z-index: 10;
    width: 44px; height: 44px; border-radius: 22px; border: 0;
    background: rgba(40, 42, 46, .55); color: #fff; font-size: 22px;
    line-height: 44px; text-align: center; padding: 0; cursor: pointer;
  }
  #gear.hidden { display: none; }
  #panel {
    position: fixed; inset: 0; z-index: 20; display: none;
    background: rgba(0, 0, 0, .6);
    align-items: center; justify-content: center;
  }
  #panel.open { display: flex; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    width: min(560px, 92vw); max-height: 90vh; overflow-y: auto;
    padding: 22px 24px; box-sizing: border-box;
  }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 18px; line-height: 1.4; }
  .row { margin: 0 0 18px; }
  .label b { font-weight: 400; }
  .label { font-size: 15px; margin: 0 0 8px; display: flex; justify-content: space-between; }
  .label span { color: var(--muted); }
  .seg { display: flex; flex-wrap: wrap; gap: 8px; }
  .seg button {
    flex: 1 1 auto; min-height: 48px; padding: 0 14px; font-size: 15px;
    background: #202327; color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; cursor: pointer;
  }
  .seg button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  input[type=range] { width: 100%; height: 40px; accent-color: var(--accent); }
  .custom { display: none; gap: 8px; margin-top: 8px; }
  .custom.on { display: flex; }
  .custom input {
    flex: 1; min-height: 44px; font-size: 16px; padding: 0 10px; box-sizing: border-box;
    background: #202327; color: var(--text); border: 1px solid var(--line); border-radius: 10px;
  }
  .actions { display: flex; gap: 10px; margin-top: 6px; }
  .actions button {
    flex: 1; min-height: 52px; font-size: 16px; border-radius: 12px; cursor: pointer;
    border: 1px solid var(--line); background: #202327; color: var(--text);
  }
  .actions .primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .hint { color: var(--muted); font-size: 13px; line-height: 1.45; margin: 14px 0 0; }
</style>
</head>
<body>
  <iframe id="frame" src="https://tespush.com" allow="autoplay; fullscreen"
          allowfullscreen scrolling="no"></iframe>

  <button id="gear" aria-label="Settings">⚙︎</button>

  <div id="panel">
    <div class="card">
      <h1 data-i18n="title"></h1>
      <p class="sub" data-i18n="sub"></p>

      <div class="row">
        <div class="label"><b data-i18n="size"></b> <span id="srcLbl"></span></div>
        <div class="seg" id="srcSeg">
          <button data-w="1280" data-h="720">1280×720</button>
          <button data-w="1600" data-h="900">1600×900</button>
          <button data-w="1920" data-h="1080">1920×1080</button>
          <button data-w="2560" data-h="1440">2560×1440</button>
          <button data-w="0" data-h="0" data-i18n="custom"></button>
        </div>
        <div class="custom" id="custom">
          <input id="cw" type="number" inputmode="numeric" data-i18n-ph="width" />
          <input id="ch" type="number" inputmode="numeric" data-i18n-ph="height" />
        </div>
      </div>

      <div class="row">
        <div class="label"><b data-i18n="fit"></b></div>
        <div class="seg" id="fitSeg">
          <button data-fit="stretch" data-i18n="stretch"></button>
          <button data-fit="contain" data-i18n="contain"></button>
          <button data-fit="cover" data-i18n="cover"></button>
        </div>
      </div>

      <div class="row">
        <div class="label"><b data-i18n="zoom"></b> <span id="zoomLbl"></span></div>
        <input id="zoom" type="range" min="60" max="120" step="1" />
      </div>

      <div class="row">
        <div class="label"><b data-i18n="gear"></b></div>
        <div class="seg" id="gearSeg">
          <button data-gear="1" data-i18n="show"></button>
          <button data-gear="0" data-i18n="hide"></button>
        </div>
      </div>

      <div class="actions">
        <button id="reload" data-i18n="restart"></button>
        <button id="close" class="primary" data-i18n="done"></button>
      </div>

      <div class="row">
        <div class="label"><b data-i18n="lang"></b></div>
        <div class="seg" id="langSeg">
          <button data-lang="en">English</button>
          <button data-lang="uk">Українська</button>
        </div>
      </div>

      <p class="hint" data-i18n-html="hint"></p>
    </div>
  </div>

<script>
(function () {
  var KEY = 't2c-wrapper-v1';
  var sysLang = /^(uk|ru)/i.test(navigator.language || '') ? 'uk' : 'en';
  var DEF = { w: 1920, h: 1080, fit: 'stretch', zoom: 100, gear: 1, lang: sysLang };
  var T = {
    en: {
      title: 'Display settings',
      sub: 'Saved in this browser and in the page URL, so you can bookmark different setups.',
      size: 'Page size for the adapter', custom: 'Custom', width: 'width', height: 'height',
      fit: 'Fit mode', stretch: 'Stretch', contain: 'Keep ratio', cover: 'Fill',
      zoom: 'Picture scale', gear: 'Settings button', show: 'Show', hide: 'Hide',
      lang: 'Language', restart: 'Restart', done: 'Done',
      hint: 'After changing the size, tap “Restart” so the adapter sees the new window. If the button is hidden, open settings by adding <b>#settings</b> to the URL.'
    },
    uk: {
      title: 'Налаштування екрана',
      sub: 'Зберігається в цьому браузері та в адресі сторінки, тож можна зробити окремі закладки під різні режими.',
      size: 'Розмір сторінки для адаптера', custom: 'Свій', width: 'ширина', height: 'висота',
      fit: 'Вписування', stretch: 'Розтягнути', contain: 'Пропорційно', cover: 'Заповнити',
      zoom: 'Масштаб картинки', gear: 'Кнопка налаштувань', show: 'Показувати', hide: 'Сховати',
      lang: 'Мова', restart: 'Перезапустити', done: 'Готово',
      hint: 'Після зміни розміру натисніть «Перезапустити», щоб адаптер побачив нове вікно. Якщо кнопку сховано, відкрити налаштування можна, додавши до адреси <b>#settings</b>.'
    }
  };

  function load() {
    var s = Object.assign({}, DEF);
    try { Object.assign(s, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
    var q = new URLSearchParams(location.search);
    if (q.get('w')) s.w = +q.get('w');
    if (q.get('h')) s.h = +q.get('h');
    if (q.get('fit')) s.fit = q.get('fit');
    if (q.get('zoom')) s.zoom = +q.get('zoom');
    if (q.get('gear')) s.gear = +q.get('gear');
    if (q.get('lang')) s.lang = q.get('lang');
    if (!T[s.lang]) s.lang = DEF.lang;
    if (!(s.w >= 320 && s.w <= 4096)) s.w = DEF.w;
    if (!(s.h >= 240 && s.h <= 4096)) s.h = DEF.h;
    if (['stretch', 'contain', 'cover'].indexOf(s.fit) < 0) s.fit = DEF.fit;
    if (!(s.zoom >= 60 && s.zoom <= 120)) s.zoom = DEF.zoom;
    return s;
  }

  var S = load();
  var $ = function (id) { return document.getElementById(id); };
  var frame = $('frame'), panel = $('panel'), gear = $('gear');

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
    var q = new URLSearchParams({ w: S.w, h: S.h, fit: S.fit, zoom: S.zoom, gear: S.gear, lang: S.lang });
    try { history.replaceState(null, '', location.pathname + '?' + q + location.hash); } catch (e) {}
  }

  function fit() {
    var vw = document.documentElement.clientWidth;
    var vh = document.documentElement.clientHeight;
    var sx = vw / S.w, sy = vh / S.h;
    if (S.fit === 'contain') sx = sy = Math.min(sx, sy);
    if (S.fit === 'cover') sx = sy = Math.max(sx, sy);
    var z = S.zoom / 100;
    sx *= z; sy *= z;
    var dx = (vw - S.w * sx) / 2, dy = (vh - S.h * sy) / 2;
    frame.style.width = S.w + 'px';
    frame.style.height = S.h + 'px';
    frame.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + sx + ',' + sy + ')';
    gear.classList.toggle('hidden', !S.gear);
  }

  function mark(segId, attr, val) {
    var bs = $(segId).querySelectorAll('button');
    for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('on', bs[i].getAttribute(attr) === String(val));
  }

  function translate() {
    var d = T[S.lang];
    document.documentElement.lang = S.lang;
    document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = d[el.getAttribute('data-i18n')]; });
    document.querySelectorAll('[data-i18n-ph]').forEach(function (el) { el.placeholder = d[el.getAttribute('data-i18n-ph')]; });
    document.querySelectorAll('[data-i18n-html]').forEach(function (el) { el.innerHTML = d[el.getAttribute('data-i18n-html')]; });
    gear.setAttribute('aria-label', d.title);
  }

  function render() {
    translate();
    mark('langSeg', 'data-lang', S.lang);
    var preset = [[1280,720],[1600,900],[1920,1080],[2560,1440]].some(function (p) { return p[0] === S.w && p[1] === S.h; });
    mark('srcSeg', 'data-w', preset ? S.w : 0);
    $('custom').classList.toggle('on', !preset);
    $('cw').value = S.w; $('ch').value = S.h;
    $('srcLbl').textContent = S.w + '×' + S.h;
    mark('fitSeg', 'data-fit', S.fit);
    mark('gearSeg', 'data-gear', S.gear);
    $('zoom').value = S.zoom;
    $('zoomLbl').textContent = S.zoom + '%';
  }

  function update() { save(); render(); fit(); }

  $('srcSeg').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var w = +b.getAttribute('data-w'), h = +b.getAttribute('data-h');
    if (w) { S.w = w; S.h = h; update(); }
    else { $('custom').classList.add('on'); mark('srcSeg', 'data-w', 0); }
  });
  function onCustom() {
    var w = +$('cw').value, h = +$('ch').value;
    if (w >= 320 && w <= 4096 && h >= 240 && h <= 4096) { S.w = w; S.h = h; save(); fit(); $('srcLbl').textContent = w + '×' + h; }
  }
  $('cw').addEventListener('change', onCustom);
  $('ch').addEventListener('change', onCustom);

  $('fitSeg').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    S.fit = b.getAttribute('data-fit'); update();
  });
  $('gearSeg').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    S.gear = +b.getAttribute('data-gear'); update();
  });
  $('langSeg').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    S.lang = b.getAttribute('data-lang'); update();
  });
  $('zoom').addEventListener('input', function () {
    S.zoom = +this.value; $('zoomLbl').textContent = S.zoom + '%'; save(); fit();
  });

  function open() { render(); panel.classList.add('open'); }
  function close() {
    panel.classList.remove('open');
    if (location.hash === '#settings') history.replaceState(null, '', location.pathname + location.search);
  }
  gear.addEventListener('click', open);
  $('close').addEventListener('click', close);
  panel.addEventListener('click', function (e) { if (e.target === panel) close(); });
  $('reload').addEventListener('click', function () {
    frame.src = 'about:blank';
    setTimeout(function () { frame.src = 'https://tespush.com'; }, 150);
    close();
  });

  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
  window.addEventListener('hashchange', function () { if (location.hash === '#settings') open(); });

  save(); fit();
  if (location.hash === '#settings') open();
})();
</script>
</body>
</html>
